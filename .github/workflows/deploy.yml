name: Deploy playru-reg.ru to GitHub Pages

# builds only src/playru-reg.ru/index.html and publishes it at the root of the Pages site

on:
  push:
    branches: [w]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Пока сайт на ЛОГИН.github.io/ИМЯ-РЕПОЗИТОРИЯ/ , база это имя репозитория.
  # Когда подключишь свой домен, замени строку на:  PUBLIC_URL: /
  #PUBLIC_URL: /${{ github.event.repository.name }}/
  PUBLIC_URL: /

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:regru -- --public-url "$PUBLIC_URL"

      # Нужно только если у приложения есть маршруты на клиенте (React Router и т.п.).
      # Раскомментируй, если прямые ссылки на внутренние страницы дают 404:
      # - run: cp dist-regru/index.html dist-regru/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-regru

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
